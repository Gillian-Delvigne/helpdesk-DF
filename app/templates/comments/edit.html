{% extends "layout/main_layout.html" %}

{% block content %}
<section class="bg-white flex flex-col grow">

    <h1 class="px-8 py-6 text-4xl">
        Commentaire
    </h1>

    <div class="flex items-center mx-auto my-8 w-full">

        <div class="mx-auto w-2/3 xl:w-1/2 px-12 py-8 bg-gray-100 rounded-md shadow-xl h-fit">

            <div>
                <h2 class="text-2xl">
                    Modifier le commentaire
                </h2>

                <hr class="px-12 mt-2 text-gray-300">
            </div>

            <form method="post" class="flex flex-col">

                {{ form.hidden_tag() }}

                <div class="p-6">
                    <div class="flex flex-col w-full">
                        <textarea
                            name="{{ form.comment_content.name }}"
                            id="{{ form.comment_content.id }}"
                            class="block h-40 w-full mt-2 rounded-md bg-white py-1.5 px-3 text-base text-gray-900 outline-1 outline-gray-300 focus:outline-2 focus:outline-indigo-600 sm:text-sm/6"
                        >{{ form.comment_content.data or "" }}
                        </textarea>
                    </div>
                </div>

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-800 text-white font-bold py-2 px-4 rounded inline-flex items-center w-fit mx-auto my-6"
                >
                    <span>Modifier le commentaire</span>
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
